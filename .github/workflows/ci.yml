#
# This workflow uses the Boost.CI reusable workflow which builds a variety of
# configurations of your project, runs tests, and generates code coverage reports.
#
# To use it, copy this file into your repository as `.github/workflows/ci.yml` and
# customize it appropriately.
#
---
name: Boost.CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - master
      - develop
      - bugfix/**
      - feature/**
      - fix/**
      - github/**
      - pr/**
    paths-ignore:
      - LICENSE
      - meta/**
      - README.md

jobs:
  call-boost-ci:
    name: Run Boost.CI
    uses: boostorg/boost-ci/.github/workflows/reusable.yml@master
    # Customization:
    with:
       enable_pr_coverage: false  # Disabled: Too many issues with lcov
       enable_cygwin: false
       depinst_args: --include doc/examples
       enable_mingw: false
       enable_multiarch: false
       timeout: 360
       max_cxx_stds_per_job: 2  # Too many configurations per job(?)
       exclude_jobs: |
          compiler: 'clang-11,clang-12', cxxstd: '17,20' # github_issue_475
          compiler: clang-16, cxxstd: 2b # dataset_example67, /include/c++/14/bits/stl_pair.h:411:14: error: no matching function for call to 'get'
          compiler: icpx-2025 # Different output leading to fail in test-macro-global-fixture.cpp
          os: macos-26  # basic_cstring-test: Missing 'std::char_traits<unsigned char>' on ARM
          os: ubuntu-24.04-arm  # system-exception-test fails
    secrets:
      # CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  Disabled: Too many issues with lcov
      COVERITY_SCAN_NOTIFICATION_EMAIL: ${{ secrets.COVERITY_SCAN_NOTIFICATION_EMAIL }}
      COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
