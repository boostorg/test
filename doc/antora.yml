nav:
  - modules/ROOT/nav.adoc

ext:
  # Commenting this stanza out is the fast inner loop when editing prose: it
  # skips MrDocs, and with it the reference module, entirely.
  cpp-reference:
    config: doc/mrdocs.yml
  cpp-tagfiles:
    using-namespaces:
      - boost::unit_test
      - boost::unit_test::data
      - boost::unit_test::data::monomorphic
      - boost::unit_test::framework
      - boost::test_tools
      - boost::debug
