    # chapter. Only the link *target* lives here, so a reference page can be
    # renamed in one place instead of at ~2000 call sites; the label stays at
    # the call site. It has to: Asciidoctor substitutes quotes before
    # attributes, and a value coming from an API attribute -- which is what
    # this file sets -- is inserted without further substitution, so `code`
    # formatting inside an attribute value would render its backticks.
